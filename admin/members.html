<!DOCTYPE html>
<html lang="mr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>अण्णा ब्रिगेड - सदस्य</title>


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">


<style>


*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;

}



body{

background:#f5f7fb;

}



/* HEADER */


header{

background:#ff6b00;

color:white;

padding:20px;

display:flex;

justify-content:space-between;

align-items:center;

}



header h2{

font-size:24px;

}



.back{

background:white;

color:#ff6b00;

border:none;

padding:12px 25px;

border-radius:25px;

cursor:pointer;

font-weight:bold;

}





.container{

padding:30px;

}




/* ADD MEMBER */


.add-box{

background:white;

padding:25px;

border-radius:20px;

box-shadow:0 10px 25px rgba(0,0,0,.08);

margin-bottom:25px;

}



input{

width:100%;

padding:14px;

margin:8px 0;

border:1px solid #ddd;

border-radius:10px;

font-size:15px;

}



.add-btn{

background:#ff6b00;

color:white;

border:none;

padding:13px 30px;

border-radius:30px;

cursor:pointer;

font-weight:bold;

}





/* SEARCH */


.search-box{

background:white;

padding:20px;

border-radius:20px;

box-shadow:0 10px 25px rgba(0,0,0,.08);

margin-bottom:25px;

}




/* TABLE */


.table-box{

background:white;

padding:20px;

border-radius:20px;

overflow-x:auto;

box-shadow:0 10px 25px rgba(0,0,0,.08);

}



table{

width:100%;

border-collapse:collapse;

}



th{

background:#ff6b00;

color:white;

padding:15px;

}



td{

padding:14px;

text-align:center;

border-bottom:1px solid #eee;

}




.edit{

background:#2196f3;

color:white;

border:none;

padding:8px 15px;

border-radius:20px;

cursor:pointer;

}



.delete{

background:red;

color:white;

border:none;

padding:8px 15px;

border-radius:20px;

cursor:pointer;

}




@media(max-width:700px){

.container{

padding:15px;

}


table{

font-size:13px;

}


}


</style>


</head>


<body>



<header>


<h2>

🟧 अण्णा ब्रिगेड सदस्य

</h2>



<button class="back" onclick="goDashboard()">

डॅशबोर्ड

</button>



</header>





<div class="container">





<!-- ADD MEMBER -->


<div class="add-box">


<h2>
नवीन सदस्य जोडा
</h2>



<input id="name"
placeholder="सदस्याचे नाव">



<input id="mobile"
placeholder="मोबाईल नंबर">



<input id="city"
placeholder="शहर">



<button class="add-btn" onclick="addMember()">

सदस्य जोडा

</button>



</div>







<!-- SEARCH -->


<div class="search-box">


<input 
id="search"
placeholder="सदस्य शोधा..."
onkeyup="searchMember()">



</div>







<!-- TABLE -->


<div class="table-box">


<table>


<thead>

<tr>

<th>नाव</th>

<th>मोबाईल</th>

<th>शहर</th>

<th>Action</th>

</tr>


</thead>



<tbody id="memberData">


</tbody>



</table>


</div>





</div>








<script type="module">


import {

auth,
db

} from "../firebase.js";



import {

onAuthStateChanged

}

from

"https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";



import {


collection,

addDoc,

getDocs,

deleteDoc,

doc,

updateDoc,

serverTimestamp


}

from

"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";







// LOGIN CHECK


onAuthStateChanged(auth,(user)=>{


if(!user){

window.location="../login.html";

}


});








let members=[];







// ADD MEMBER


window.addMember=async function(){



let name=document.getElementById("name").value;

let mobile=document.getElementById("mobile").value;

let city=document.getElementById("city").value;




if(name=="" || mobile==""){

alert("नाव आणि मोबाईल आवश्यक आहे");

return;

}



await addDoc(

collection(db,"members"),

{


name:name,

mobile:mobile,

city:city,

createdAt:serverTimestamp()


}

);



alert("सदस्य जोडला गेला");



document.getElementById("name").value="";

document.getElementById("mobile").value="";

document.getElementById("city").value="";



loadMembers();



}









// LOAD MEMBERS


async function loadMembers(){


members=[];


let snapshot=

await getDocs(

collection(db,"members")

);



snapshot.forEach(item=>{


members.push({

id:item.id,

...item.data()

});


});



displayMembers(members);


}








// DISPLAY


function displayMembers(data){



let table=document.getElementById("memberData");



table.innerHTML="";



if(data.length==0){


table.innerHTML=`

<tr>

<td colspan="4">

कोणताही सदस्य उपलब्ध नाही

</td>

</tr>

`;


return;

}




data.forEach(member=>{


table.innerHTML+=`


<tr>


<td>

${member.name}

</td>


<td>

${member.mobile}

</td>


<td>

${member.city}

</td>



<td>



<button class="edit"

onclick="editMember(

'${member.id}',

'${member.name}',

'${member.mobile}',

'${member.city}'

)">

Edit

</button>





<button class="delete"

onclick="deleteMember('${member.id}')">

Delete

</button>




</td>



</tr>


`;



});



}









// SEARCH


window.searchMember=function(){



let value=

document.getElementById("search").value.toLowerCase();



let result=

members.filter(member=>


member.name.toLowerCase()

.includes(value)



);



displayMembers(result);



}









// DELETE


window.deleteMember=async function(id){



if(confirm("सदस्य Delete करायचा आहे का?")){


await deleteDoc(

doc(db,"members",id)

);



alert("सदस्य Delete केला");


loadMembers();



}


}









// EDIT


window.editMember=async function(

id,

name,

mobile,

city


){



let newName=

prompt("नाव",name);



let newMobile=

prompt("मोबाईल",mobile);



let newCity=

prompt("शहर",city);





if(!newName || !newMobile || !newCity){

return;

}





await updateDoc(

doc(db,"members",id),

{


name:newName,

mobile:newMobile,

city:newCity


}

);



alert("माहिती Update झाली");


loadMembers();



}









window.goDashboard=function(){


window.location="dashboard.html";


}






loadMembers();



</script>



</body>

</html>
